<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Email Spam Classifier</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="page">

    <!-- HEADER -->
    <div class="project-header">
      <div class="header-top-row">
        <div class="project-title">FINAL YEAR PROJECT (CMP 499)</div>
        <button class="theme-toggle" id="themeToggle" title="Toggle light/dark mode">🌙</button>
      </div>

      <div class="info-box">
        <span>Olabisi Onabanjo University</span>
        <span class="sep">|</span>
        <span>Department of Computer Sciences</span>
        <span class="sep">|</span>
        <span>Olabintan Yusuf Olatunji</span>
        <span class="sep">|</span>
        <span>SCI/22/23/0836</span>
      </div>

      <div class="header-divider"></div>
    </div>

    <!-- MAIN GRID -->
    <div class="main-grid">

      <!-- LEFT: Email + Prediction -->
      <div class="col left-col">
        <p class="section-label">Email Content</p>
        <textarea id="emailText" placeholder="Paste the email content here..."></textarea>

        <div class="btn-stack">
          <button id="btnCheck">Check</button>
          <div class="btn-row">
            <button class="secondary" id="btnHam">Random HAM</button>
            <button class="secondary" id="btnSpam">Random SPAM</button>
          </div>
        </div>

        <div class="result-card">
          <p class="section-label" style="margin-bottom:6px">Prediction Result</p>
          <div class="resultLine" id="resultLine">Result: —</div>
          <div class="barWrap"><div class="bar" id="confBar"></div></div>
          <div class="err" id="errBox"></div>
        </div>
      </div>

      <!-- COLUMN DIVIDER -->
      <div class="col-divider"></div>

      <!-- RIGHT: Metrics -->
      <div class="col right-col">
        <p class="section-label">Model Evaluation Metrics</p>

        <div class="metric-grid">
          <button class="secondary metric-btn" onclick="fetchMetric('accuracy','Accuracy')">Accuracy</button>
          <button class="secondary metric-btn" onclick="fetchMetric('precision','Precision')">Precision</button>
          <button class="secondary metric-btn" onclick="fetchMetric('recall','Recall')">Recall</button>
          <button class="secondary metric-btn" onclick="fetchMetric('f1','F1-Score')">F1-Score</button>
          <button class="secondary metric-btn full" onclick="fetchMetric('roc_auc','ROC-AUC')">ROC-AUC</button>
        </div>

        <!-- pushed to bottom by margin-top:auto -->
        <div class="metric-result" id="metricResult" style="display:none">
          <div class="metric-top">
            <span class="metric-name"  id="metricName">—</span>
            <span class="metric-value" id="metricValue">—</span>
          </div>
          <div class="metric-formula" id="metricFormula"></div>
        </div>

        <!-- spacer fills remaining height so columns bottom-align -->
        <div class="col-spacer"></div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
  <script>
    const toggleBtn = document.getElementById("themeToggle");
    const root      = document.documentElement;
    const saved     = localStorage.getItem("theme") || "dark";
    root.setAttribute("data-theme", saved);
    toggleBtn.textContent = saved === "dark" ? "🌙" : "☀️";
    toggleBtn.addEventListener("click", () => {
      const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      toggleBtn.textContent = next === "dark" ? "🌙" : "☀️";
      localStorage.setItem("theme", next);
    });
  </script>
</body>
</html>
